name: Collect photo candidates

# Downloads thumbnail candidates per destination so they can be reviewed
# before any photo is pinned. Commons ranks by file size, not suitability.
on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Candidates per destination'
        default: '8'

permissions:
  contents: write

jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/fetch-images.mjs --candidates=${{ inputs.count }}
      - name: Commit candidates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .candidates
          git diff --staged --quiet && { echo "no candidates"; exit 0; }
          git commit -m "Collect photo candidates for review"
          git push
